services:

  backend:
    image: diabetes-backend:latest
    container_name: diabetes-backend
    ports:
      - "8000:8000"

  frontend:
    image: diabetes-frontend:latest
    container_name: diabetes-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend